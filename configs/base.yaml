# RSNA Knee Abnormality Detection — base config
#
# data_dir: competition data mount. Kaggle nests inputs by type, hence the
# competitions/ segment. resolve_data_dir() falls back to scanning /kaggle/input
# for whatever directory holds sample_submission.csv, so this can be stale
# without breaking anything.
# local_dir: where the (tiny) metadata CSVs live when working off-Kaggle.
data_dir: /kaggle/input/competitions/rsna-knee-abnormality-detection
local_dir: data
work_dir: /kaggle/working

seed: 42

# ---- DEBUG: route every Kaggle run through this until the path is clean ----
# Small subset, capped steps. Validates the whole pipeline in minutes rather
# than burning an hour of the weekly GPU quota on a shape error.
debug: true
debug_n_studies: 24
debug_max_steps: 2

# ---- data / preprocessing ----
img_size: 224
slices_per_series: 6      # decoded and kept per series
# 6 covers every distinct (plane, fluid, fat-sat) slot the dataset contains
# (max 6, mean 4.8), so studies stop losing series to select_series's tie-break
# on group size — which is arbitrary when, as usual, every slot holds exactly
# one series.
max_series: 6             # series slots kept per study
series_slot_keys:         # which columns define a distinct series "slot"
  - Anatomical_Plane
  - Fluid_Sensitive
  - Fat_Suppression
train_series_root: train_series
test_series_root: test_series

# Decode-once cache. The first epoch decodes every study and writes it here as
# uint8; later epochs just load the array. A relative path resolves against
# work_dir. Set to null to decode every epoch (the old behaviour).
#
# Absolute on purpose: work_dir is the notebook's version output, so a relative
# path there would publish the whole ~8 GB of .npy files as the run's Output
# (and make `kaggle kernels output` download them).
#
# Size scales with img_size^2: ~8 GB at 224 for the 4407 training studies, so
# raising img_size to 384 would need ~23 GB — at that point shrink
# slices_per_series * max_series or drop the cache.
cache_dir: /tmp/rsne-cache

# Report-derived labels written by extract_labels.py. A relative path resolves
# against work_dir; on Kaggle point this at the attached dataset instead, e.g.
# /kaggle/input/rsne-derived-labels/labels_derived.csv, because /kaggle/working
# does not survive between sessions.
derived_labels: labels_derived.csv

# ---- model ----
# DINOv2-small: a self-supervised ViT that transfers far better than an
# ImageNet ResNet. Only the last `freeze_backbone_blocks` transformer blocks
# stay trainable; everything before them is frozen — the main regularizer
# against overfitting the ~3.5k weakly-labelled studies.
backbone: vit_small_patch14_dinov2.lvd142m
pretrained: true
dropout: 0.2
freeze_backbone_blocks: 6

# For the OFFLINE submission run timm cannot download weights. Attach a dataset
# holding the timm cache and point this at it, e.g. /kaggle/input/timm-cache.
# Leave null to use the default location.
torch_home: null

# ---- optimisation ----
batch_size: 4
# DINOv2 is heavier per step than resnet34, so fewer epochs both to fit the run
# budget and to match the frozen-backbone recipe. Weights are saved every epoch,
# so a timeout still leaves the latest checkpoint.
epochs: 12
lr: 0.0003            # fallback for whichever lr_* is unset
lr_backbone: 0.000008 # mostly-frozen ViT: two orders below the head
lr_head: 0.001
weight_decay: 0.0001
num_workers: 4
amp: true

# ---- validation ----
# Grouped split is mandatory: random K-fold lets the model memorise the scanner
# and inflates macro-AUC by a lot. Groups come from DICOM headers, cached to
# work_dir/study_groups.csv so later runs skip the header pass.
n_folds: 5
fold: 0

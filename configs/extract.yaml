# Report -> label extraction.
#
# One-time offline job. Runs in a Kaggle notebook with Internet ON (it has to
# fetch the model weights), which is fine: this is NOT the submission notebook.
# The submission runs offline and only reads the CSV this produces.

# Kaggle nests inputs by type. If this ever 404s, resolve_data_dir falls back
# to scanning /kaggle/input for sample_submission.csv.
data_dir: /kaggle/input/competitions/rsna-knee-abnormality-detection
local_dir: data
work_dir: /kaggle/working

# Qwen3 is Apache-2.0 and is the family most often validated for structured
# extraction from multilingual clinical text. 4B in fp16 is ~8GB, which leaves
# room on a single T4 and keeps throughput sane on a 30h/week quota.
# Confirm the exact repo id on HuggingFace before the first run.
model_name: Qwen/Qwen3-4B-Instruct-2507

# T4 is Turing: it has no bf16 units, so fp16 is the correct dtype here.
dtype: float16

# Memory is set by the LONGEST report in a batch, not the average: padding
# stretches every sequence in the batch to that length. The longest training
# report is 4743 chars, so a batch of 16 can want ~7GB of KV cache on top of the
# ~8GB of fp16 weights, which is over a T4's 14.5GB. 4 keeps the worst batch
# near 10GB. This already OOMed at 16 on a 58-study probe.
batch_size: 4

# The answer is 12 lines of "name: bit - reason". At 320 the run truncated: the
# tail findings (Fracture 41/58, Contusion 30/58, Baker's 25/58) came back
# unread, and unread cells are dropped by eval, which inflates the scorecard.
# The prompt now caps each reason at six words (~180 tokens for all 12 lines),
# so this budget is deliberately generous: it is the headroom that keeps a
# chatty generation from eating the last lines.
max_new_tokens: 512
enable_thinking: false

# Longest report seen is well under this; the cap keeps one pathological
# document from blowing up the batch's memory.
max_report_chars: 8000

output: labels_derived.csv

# Smoke test: set to e.g. 20 to prove the path works before spending hours.
limit: null

# Skip studies already present in the output file, so a killed session
# (12h cap) can be resumed instead of restarted.
resume: true
